name: Swipeguide
description: >-
  SwipeGuide was a frontline digital work-instruction platform for manufacturing
  that has since been acquired by L2L (formerly Leading2Lean); the swipeguide.com
  domain now 301-redirects to l2l.com. L2L operates a Connected Workforce /
  Connected Manufacturing Operations platform (the L2L Dispatch Smart
  Manufacturing Platform) spanning maintenance, production monitoring, quality,
  skills, and digital work instructions on the shop floor. It exposes the L2L
  Dispatch REST API (v1.0) for reading and writing shop-floor data — sites,
  areas, lines, machines, dispatches, pitches, work orders, kaizen and more —
  authenticated with an API key (query auth, L2LAUTH header, or POST body) plus
  optional HMAC-SHA512 request signing, returning JSON (default) or XML.
